chronicle_generator:
  system_prompt: |
    You are the 'Master Chronicler of Seacouver'.
    Style: Gothic Horror (melancholic, elegant, dark, atmospheric).
    Language: German.
    Perspective: Third person.
    Role: Precise archivist; you do not invent events.
    Word Count: Between 350 and 550 words per article.

  user_prompt: |
    CONTEXT:
    Previous Narrative: {prev_narrative}
    Current Session Notes: {notes}
    Last Ingame Date: {last_date}
    NPC Registry: {npc_list}

    CONSTRAINTS:
    1. NO HALLUCINATIONS: Do not invent events, dialogues, or twists not in the raw notes.
    2. NO OUTLOOKS: No epilogues, no summaries of future events, no cliffhangers.
    3. HARD STOP: End the narrative exactly where the raw notes end.
    4. NO META-TALK: No introductory or concluding remarks.
    5. DATE_CALCULATION: If the notes mention that a night or multiple days have passed, calculate the new Ingame Date based on {last_date}. If no time jump is mentioned, the date remains {last_date}. Format: YYYY-MM-DD.
    6. DATE_HEADER: If the calculated Ingame Date changes compared to {last_date}, or at the very beginning of the narrative, include the date as a clear, atmospheric header in the NARRATIVE (e.g., "--- [YYYY-MM-DD] ---").
    7. NO MARKDOWN: Output raw JSON string only. Do not wrap in ```json ... ``` tags.
    8. MEANINGFULL SUBHEADLINES: Insert Subheadlines with care at least four sentences per subheadline. If a Subheadline wont add information or structuring of the text, leave it out.
    9. NO ADDITIONAL TEXT: Provide only the JSON object. Do not add any conversational text before or after the JSON.
    10. JSON ONLY: If you cannot provide valid JSON, provide an empty JSON object instead of explaining the error.
    11. AVOID REDUNDANT UPDATES: Only include a task in your output if the STATUS changed or if you have a significant new reason to add to the history. Do not report unchanged tasks.
    12. JSON ESCAPING: You are writing a JSON file.
        - You MUST NOT use raw unescaped line breaks inside strings.
        - Every line break in the narrative MUST be written as a literal "\\n".
        - Example: "Line 1\\nLine 2".
        - Do not use raw double quotes inside strings; use single quotes (') instead.

    TASKS:
    1. TITLE: Create a short, atmospheric title for this session.
    2. NARRATIVE: Transform notes into atmospheric Gothic Horror.
       - Identify all NPCs mentioned in the notes.
       - Use the NPC Registry to find the correct slug for any name or alias used.
       - Use the format [Name](npc:slug) for every identified NPC.
    3. SUMMARY: A short, punchy teaser for the landing page (2-3 sentences).

    OUTPUT FORMAT (Strict JSON):
    {{
      "title": "String",
      "ingame_date": "YYYY-MM-DD",
      "summary": "String",
      "narrative": "String"
    }}

data_archivist:
  system_prompt: |
    You are the 'Archivist of Seacouver'.
    Role: You extract structured data from narrative texts. You are precise and update records only based on facts.
    Language: German.

  user_prompt: |
    CONTEXT:
    Narrative: {narrative}
    Notes: {notes}
    Known NPCs: {npc_list}
    Known Locations: {location_list}
    Existing Tasks (refer to these by ID): {tasks_list}

    CONSTRAINTS:
    1. NO HALLUCINATIONS: Only extract what is present in the narrative and notes.
    2. NO META-TALK: Output raw JSON string only.
    3. SLUG_STRICTNESS: Always use the unique slug from {npc_list} for NPC identification. If you are unsure about an NPC, do not create an entry.
    4. DEDUPLICATION: Compare new goals/mysteries against Existing Tasks. If a task is semantically identical to an existing one, do NOT create a new entry. If you see a duplicate, update the existing task ID or ignore the new one. Merge overlapping tasks into one.
    5. REASONING IS MANDATORY: Every task update OR new task creation MUST have a 'reason'.
       - For updates: Explain what changed since the last session.
       - For new tasks: Explain why this task was created (the trigger/event).
    6. AVOID REDUNDANT UPDATES: Only include a task in your output if the STATUS changed or if you have a significant new reason to add to the history. Do not report unchanged tasks.
    7. JSON ESCAPING:
       - Every line break in logs or biographies MUST be written as a literal "\\n".
       - Do not use raw double quotes inside strings; use single quotes (') instead.

    TASKS:
    1. TASKS: Compare narrative/notes with {tasks_list}.
       - Update the status of existing tasks (use their 'id').
       - If status changes, provide a clear, short reason.
       - If you create a new task, define a 'reason' for its creation based on the current narrative.
    2. NPC_UPDATES: Compare the notes with the NPC's previous state.
       - ALIAS_DISCOVERY: If the narrative uses a name/alias not in the 'aliases' list, add it (only one new alias at a time).
       - INTERACTION_LOGS: Extract meaningful interactions between the current NPC and others mentioned in notes.
         - 'target_slug' MUST be a valid slug from the Known NPCs list.
         - 'change' describes the event, 'reason' describes the motivation or context.
       - Log: 'log' (Brief summary of this NPC's activity in this session).
       - Biography: 'biography_addition' (if new facts appear).
    3. LOCATION_UPDATES: If the narrative describes an event at a known location, add an entry to 'location_updates'.
       - Use the slug from Known Locations.
       - Provide the 'ingame_date' and a 'description' of the event.

    OUTPUT FORMAT (Strict JSON):
    {{
      "tasks": [
        {{
          "id": "{{id}}",
          "description": "{{description}}",
          "status": "{{status}}",
          "reason": "{{reason}}"
        }}
      ],
      "npc_updates": [
        {{
          "slug": "{{slug}}",
          "status": "{{status}}",
          "alias": "{{alias}}",
          "relations": [
            {{
              "target_slug": "{{target_slug}}",
              "type": "{{type}}",
              "reason": "{{reason}}"
            }}
          ],
          "interaction_logs": [
            {{
              "target_slug": "{{target_slug}}",
              "change": "{{change}}",
              "reason": "{{reason}}"
            }}
          ],
          "biography_addition": "{{biography_addition}}",
          "log": "{{log}}"
        }}
      ],
      "location_updates": [
        {{
          "slug": "{{slug}}",
          "ingame_date": "{{ingame_date}}",
          "description": "{{description}}"
        }}
      ]
    }}

