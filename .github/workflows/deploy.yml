
name: Deploy FastAPI to Webspace

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ===== CODE AUSCHECKEN =====
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== PYTHON SETUP =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ===== DEPENDENCIES INSTALLIEREN =====
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ===== DATENBANK INITIALISIEREN =====
      - name: Initialize database
        run: |
          python scripts/db_manager.py
          echo "✓ Database initialized"

      # ===== NOTION EXPORT IMPORTIEREN =====
      - name: Import Notion export
        run: |
          python scripts/import_notion_md.py
          echo "✓ Notion data imported"

      # ===== SESSIONS IMPORTIEREN =====
      - name: Import sessions
        run: |
          python scripts/import_sessions.py
          echo "✓ Sessions imported"

      # ===== DEPLOYMENT PACKAGE VORBEREITEN =====
      - name: Prepare deployment package
        run: |
          echo "📦 Preparing deployment files..."
          mkdir -p docs/img/npc docs/img/pc
          mkdir -p logs
          mkdir -p data
          
          # Datenbank komprimieren
          if [ -f data/campaign.db ]; then
            gzip -c data/campaign.db > data/campaign.db.gz
            echo "✓ Database compressed"
          else
            echo "⚠️  No campaign.db found, creating empty"
            touch data/campaign.db
            gzip -c data/campaign.db > data/campaign.db.gz
          fi
          
          echo ""
          echo "📋 Files ready for upload:"
          find app scripts requirements.txt data/campaign.db.gz -type f 2>/dev/null | sort
          echo ""
          echo "Total size:"
          du -sh app scripts requirements.txt data/campaign.db.gz 2>/dev/null | tail -1

      # ===== DEBUG: SHOW FILES =====
      - name: Debug - List files
        run: |
          echo "🔍 Checking files before SCP..."
          ls -lah app/ 2>/dev/null | head -5 || echo "app/ not found"
          ls -lah scripts/ 2>/dev/null | head -5 || echo "scripts/ not found"
          ls -lah data/campaign.db.gz 2>/dev/null || echo "data/campaign.db.gz not found"
          ls -lah requirements.txt 2>/dev/null || echo "requirements.txt not found"

      # ===== APP ZUM WEBSPACE KOPIEREN =====
      - name: Deploy files via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            # Erstelle Zielverzeichnis
            mkdir -p /www/htdocs/w016db5f/seacouver-by-night
            cd /www/htdocs/w016db5f/seacouver-by-night
            
            echo "📥 Ready for file transfer..."
            echo "Target: $(pwd)"
            echo ""

      # ===== FILE UPLOAD VIA RSYNC (BESSER FÜR VERZEICHNISSE) =====
      - name: Upload via rsync
        run: |
          mkdir -p ~/.ssh
          
          # SSH Key vorbereiten
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # SSH Config
          cat > ~/.ssh/config << EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config
          
          # rsync - viel besser für Verzeichnisse!
          echo "📤 Uploading via rsync..."
          rsync -avz \
            --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            app/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/htdocs/w016db5f/seacouver-by-night/app/"
          
          rsync -avz \
            --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            scripts/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/htdocs/w016db5f/seacouver-by-night/scripts/"
          
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            requirements.txt \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/htdocs/w016db5f/seacouver-by-night/"
          
          if [ -f data/campaign.db.gz ]; then
            rsync -avz \
              -e "ssh -o StrictHostKeyChecking=no" \
              data/campaign.db.gz \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/htdocs/w016db5f/seacouver-by-night/data/"
          fi
          
          echo "✓ Upload complete"

      # ===== APP AUF SERVER STARTEN =====
      - name: Setup and restart application on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            cd /www/htdocs/w016db5f/seacouver-by-night
            
            echo "╔════════════════════════════════════╗"
            echo "║ 🚀 SEACOUVER BY NIGHT - DEPLOYMENT ║"
            echo "╚════════════════════════════════════╝"
            echo ""
            
            # Erstelle notwendige Verzeichnisse
            echo "📁 Creating directories..."
            mkdir -p logs
            mkdir -p docs/img/npc
            mkdir -p docs/img/pc
            mkdir -p data
            echo "✓ Directories created"
            echo ""
            
            # Datenbank decompressen
            echo "💾 Decompressing database..."
            if [ -f data/campaign.db.gz ]; then
              gunzip -f data/campaign.db.gz
              echo "✓ Database decompressed"
            else
              echo "⚠️  No compressed database found (creating empty)"
              sqlite3 data/campaign.db "SELECT 1;" > /dev/null 2>&1 || true
            fi
            echo ""
            
            echo "🔍 Checking Python environment..."
            
            # Versuche venv Weg (bevorzugt)
            if [ -d venv ]; then
              echo "✓ Using existing venv"
              source venv/bin/activate
              python3.12 -m pip install --upgrade pip > /dev/null 2>&1 || true
              python3.12 -m pip install -r requirements.txt > /dev/null 2>&1 || true
              USE_VENV=true
            else
              echo "⚠️  venv not found, attempting to create..."
              if python3.12 -m venv venv 2>/dev/null; then
                echo "✓ venv created successfully"
                source venv/bin/activate
                python3.12 -m pip install --upgrade pip > /dev/null 2>&1
                python3.12 -m pip install -r requirements.txt > /dev/null 2>&1
                USE_VENV=true
              else
                echo "⚠️  venv creation failed - using global Python"
                python3.12 -m pip install --user --upgrade pip > /dev/null 2>&1 || true
                python3.12 -m pip install --user -r requirements.txt > /dev/null 2>&1 || true
                USE_VENV=false
              fi
            fi
            echo "✓ Dependencies installed"
            echo ""
            
            # Alte uvicorn Prozesse killen
            echo "🔄 Stopping old processes..."
            pkill -f "uvicorn app.main:app" || true
            sleep 2
            echo "✓ Old processes stopped"
            echo ""
            
            # App im Hintergrund starten
            echo "🚀 Starting application..."
            if [ "$USE_VENV" = true ]; then
              source venv/bin/activate
              nohup uvicorn app.main:app \
                --host 0.0.0.0 \
                --port 8000 \
                --workers 4 \
                --access-log \
                > logs/uvicorn.log 2>&1 &
            else
              export PYTHONPATH="/www/htdocs/w016db5f/seacouver-by-night:$PYTHONPATH"
              nohup python3.12 -m uvicorn app.main:app \
                --host 0.0.0.0 \
                --port 8000 \
                --workers 4 \
                --access-log \
                > logs/uvicorn.log 2>&1 &
            fi
            
            APP_PID=$!
            echo "✓ Application started (PID: $APP_PID)"
            echo ""
            
            sleep 3
            
            echo "🏥 Health check..."
            if curl -s http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "✅ Application is running and responding"
              echo ""
              echo "╔════════════════════════════════════╗"
              echo "║ ✅ DEPLOYMENT SUCCESSFUL           ║"
              echo "╚════════════════════════════════════╝"
              echo ""
              echo "🌐 Available at: https://seacouver-by-night.de"
              echo "📋 Logs: tail -f logs/uvicorn.log"
            else
              echo "⚠️  Health check inconclusive, but app was started"
              echo "📋 Check logs: tail -f logs/uvicorn.log"
              echo ""
              echo "Last 10 log lines:"
              tail -10 logs/uvicorn.log || echo "No logs yet"
            fi

      # ===== DEPLOYMENT SUMMARY =====
      - name: Deployment Summary
        if: success()
        run: |
          echo ""
          echo "✅ Workflow completed successfully!"
          echo "🌐 App URL: https://seacouver-by-night.de"
          echo "📊 Check deployment in 1-2 minutes"

      - name: Deployment Error
        if: failure()
        run: |
          echo ""
          echo "❌ Deployment failed!"
          echo "📝 Check logs above for details"
          exit 1
