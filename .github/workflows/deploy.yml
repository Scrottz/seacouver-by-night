# .github/workflows/deploy.yml
name: Deploy Static Site to Webspace

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static site
        run: |
          echo "🏗️  Generating static site..."
          python scripts/generate_static.py
          echo ""
          echo "✅ Static site generated"

      - name: Prepare deployment
        run: |
          echo "📦 Preparing deployment files..."
          
          # Check generated files
          echo ""
          echo "📊 Generated files:"
          find public -type f -name "*.html" | wc -l | xargs echo "   HTML files:"
          find public -type f -name "*.css" | wc -l | xargs echo "   CSS files:"
          find public/img -type f 2>/dev/null | wc -l | xargs echo "   Images:"
          
          # Ensure data directory exists
          mkdir -p data
          
          echo ""
          if [ -f data/campaign.db ]; then
            ls -lh data/campaign.db | awk '{print "   Database size: " $5}'
          else
            echo "   ⚠️  Warning: No database found!"
          fi
          
          echo ""
          echo "✅ Deployment package ready"

      - name: Deploy static site
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "public/*"
          target: "/www/htdocs/w016db5f/seacouver-by-night.de"
          strip_components: 1
          overwrite: true

      - name: Deploy database (reference)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "data/campaign.db"
          target: "/www/htdocs/w016db5f/seacouver-by-night.de/data"
          strip_components: 0
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            cd /www/htdocs/w016db5f/seacouver-by-night.de
            
            echo "╔════════════════════════════════════╗"
            echo "║ 🦇 SEACOUVER BY NIGHT - DEPLOYMENT ║"
            echo "╚════════════════════════════════════╝"
            echo ""
            
            echo "🔍 Verifying deployment..."
            echo ""
            
            # Check HTML files
            HTML_COUNT=$(find . -maxdepth 2 -name "*.html" -type f 2>/dev/null | wc -l)
            echo "   📄 HTML files: $HTML_COUNT"
            
            # Check images
            IMG_COUNT=$(find img -type f 2>/dev/null | wc -l)
            echo "   🖼️  Images: $IMG_COUNT"
            
            # Check static files
            CSS_COUNT=$(find static -type f 2>/dev/null | wc -l)
            echo "   🎨 Static assets: $CSS_COUNT"
            
            # Check database
            if [ -f data/campaign.db ]; then
              DB_SIZE=$(du -h data/campaign.db | cut -f1)
              echo "   💾 Database: $DB_SIZE"
            fi
            
            echo ""
            echo "✅ Key pages:"
            
            # Check key pages exist
            PAGES=(
              "index.html"
              "characters.html"
              "chronik/index.html"
              "characters/liora_mikhailov/index.html"
              "characters/alistar_ionman/index.html"
              "characters/marius_raimondi/index.html"
            )
            
            for page in "${PAGES[@]}"; do
              if [ -f "$page" ]; then
                echo "   ✓ $page"
              else
                echo "   ✗ $page (MISSING!)"
              fi
            done
            
            echo ""
            echo "╔════════════════════════════════════╗"
            echo "║ ✅ DEPLOYMENT SUCCESSFUL           ║"
            echo "╚════════════════════════════════════╝"
            echo ""
            echo "🌐 Live at: https://seacouver-by-night.de"
            echo ""

      - name: Deployment Summary
        if: success()
        run: |
          echo ""
          echo "✅ Workflow completed successfully!"
          echo "🦇 Website: https://seacouver-by-night.de"
          echo "⚡ 100% static - no server needed"
          echo ""

      - name: Deployment Error
        if: failure()
        run: |
          echo ""
          echo "❌ Deployment failed!"
          echo "📝 Check logs above for details"
          exit 1

