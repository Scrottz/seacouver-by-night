name: Deploy Vampire Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mkdocs mkdocs-material openai

      - name: Run AI and Gallery Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/build_site.py

      - name: Build Static Site
        run: mkdocs build

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Wir laden den gesamten Inhalt des 'site' Ordners hoch
          source: "site/*" 
          target: "/www/htdocs/w016db5f/seacouver-by-night.de/"
          # strip_components: 1 sorgt dafür, dass der Ordner 'site/' 
          # selbst nicht auf dem Server erstellt wird, sondern nur dessen Inhalt.
          strip_components: 1

