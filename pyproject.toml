[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seacouver-by-night"
version = "0.0.1"
description = "Seacouver by Night DB and Website Builder"
authors = [{ name = "Franz Keilholz" }]
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "jinja2==3.1.2",
    "python-multipart==0.0.6",
    "openai==1.3.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
]

# ---------------------------------------------------------------------------
# Paket-Konfiguration
# ---------------------------------------------------------------------------
[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "lib*"]
